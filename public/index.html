<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PM 审计台</title>
<link rel="stylesheet" href="/style.css?v=20261126a">
</head>
<body>
<div class="insecure-banner" id="insecure-banner" hidden></div>
<div class="shell">
  <aside class="side">
    <div class="side-brand"><span class="mark">PM</span><b>审计台</b></div>
    <div class="side-head"><span>项目</span><button class="mini" id="btn-new">＋ 立项</button></div>
    <nav class="projects" id="projects"></nav>
    <div class="side-foot">
      <button class="side-btn" id="btn-import">导入数据包</button>
      <button class="side-btn" id="btn-settings">API 设置</button>
      <button class="side-btn" id="btn-help">使用说明</button>
      <div class="side-status" id="side-status"></div>
    </div>
  </aside>

  <div class="work">
    <header class="top">
      <div class="brand">
        <h1 id="pname">—</h1>
        <span class="repo" id="repo"></span>
      </div>
      <div class="top-right">
        <button type="button" class="who" id="who" title="本机身份（由 gh / git 识别）" disabled>请先选择项目</button>
        <span class="chip" id="role"></span>
        <span class="meta" id="fetched"></span>
        <span class="chip mono" id="hash" title="数据包指纹"></span>
        <span class="chip" id="model"></span>
        <button class="btn ghost" id="btn-auto" title="每隔 10 分钟检查远端，有变化才刷新并写回">自动</button>
        <button class="btn ghost" id="btn-sync" title="从仓库 .pm/ 读取最新 PM 数据包">同步</button>
        <button class="btn ghost" id="btn-publish" title="把当前数据包与 Agent 简报写回仓库 .pm/">写回</button>
        <button class="btn" id="export" title="导出为可复现的数据包">导出</button>
        <button class="btn primary" id="refresh">刷新数据</button>
      </div>
    </header>

    <main id="main">
      <section class="welcome" id="welcome" hidden>
        <h2>还没有项目数据</h2>
        <p>导入数据包，或从空项目走一遍立项向导。</p>
        <ol>
          <li><b>导入数据包</b>：重算指纹，一致才接收。</li>
          <li><b>立项</b>：填项目底座 → 生成调研 → 生成计划 → 创建。</li>
        </ol>
        <p class="muted">指纹只保证数据包自洽，不代表验收通过。</p>
        <div class="welcome-actions">
          <button class="btn primary" id="welcome-import">导入数据包</button>
          <button class="btn" id="welcome-new">＋ 立项</button>
        </div>
      </section>

      <div id="dashboard" hidden>
        <nav class="tabs" id="page-tabs" aria-label="分页">
          <button data-page="0" class="on">流程</button>
          <button data-page="1">进度</button>
          <button data-page="2">证据链</button>
          <button data-page="3">对话</button>
        </nav>
        <div class="pages" id="pages">
          <section tabindex="0" class="page page-flow">
            <section class="stats" id="stats"></section>
            <section class="next-actions" id="next-actions"></section>
            <div class="notice" id="notice" hidden></div>

            <section class="card graph-card">
              <div class="card-head">
                <h2>任务依赖图</h2>
                <div class="filters">
                  <span id="filters"></span>
                  <button type="button" id="graph-fit" class="graph-fit">全貌</button>
                  <button type="button" id="graph-expand" class="graph-fit">展开</button>
                </div>
              </div>
              <div class="legend" id="legend"></div>
              <div class="graph-scroll" id="graph-scroll">
                <svg id="graph" xmlns="http://www.w3.org/2000/svg"></svg>
              </div>
              <p class="hint">拖动平移 · 单击看简报 · 橙线为关键路径</p>
            </section>
          </section>

          <section tabindex="0" class="page page-progress">
            <div class="progress-grid">
              <section class="card">
                <h2>关键路径</h2>
                <div id="critical"></div>
                <div class="card-foot">
                  <button class="mini" id="btn-prnote" title="把当前进度摘要评论到指定 PR">发 PR 备注</button>
                </div>
              </section>
              <section class="card">
                <div class="card-head">
                  <h2>催办</h2>
                  <span class="chip" id="alerts-count"></span>
                </div>
                <p class="hint">按关键路径排序；仅本机提醒。</p>
                <div id="blockers"></div>
              </section>
              <section class="card">
                <h2>按人</h2>
                <div id="people"></div>
              </section>
            </div>
          </section>

          <section tabindex="0" class="page page-trail">
            <section class="card trail-card">
              <div class="card-head">
                <h2>证据链审计</h2>
                <div class="trail-tools">
                  <span class="chip" id="trail-verify"></span>
                  <button class="mini" id="btn-trail-md" title="下载 Markdown 证据链报告">下载报告</button>
                </div>
              </div>
              <p class="hint">完成以合并 PR / 关闭 issue 为准；证据可点回 GitHub。</p>
              <div class="trail-scroll" id="trail"></div>
            </section>
          </section>

          <section tabindex="0" class="page page-chat">
            <section class="card chat-card">
                <div class="card-head">
                  <h2>对话</h2>
                  <div class="seg" id="mode">
                    <button data-mode="beginner">小白</button>
                    <button data-mode="advanced">进阶</button>
                  </div>
                </div>
                <div class="chat-tools">
                  <button class="tool" id="btn-agent">Agent 简报</button>
                </div>
                <div class="chat" id="chat"></div>
                <div class="prompts" id="prompts"></div>
                <div class="composer">
                  <textarea id="q" rows="2" placeholder="问进度、问卡点，或问一个代码问题…"></textarea>
                  <button class="btn primary" id="send">发送</button>
                </div>
              </section>
          </section>
        </div>
      </div>
    </main>
  </div>
</div>

<div id="node-peek" hidden></div>

<div class="drawer-mask" id="mask" hidden></div>
<aside class="drawer" id="drawer" hidden></aside>

<div class="modal-mask" id="modal-mask" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>

<script src="/js/core.js?v=20261128a"></script>
<script src="/js/security.js?v=20261128a"></script>
<script src="/js/projects.js?v=20261128a"></script>
<script src="/js/paging.js?v=20261128a"></script>
<script src="/js/overview.js?v=20261128a"></script>
<script src="/js/graph.js?v=20261128a"></script>
<script src="/js/progress.js?v=20261128a"></script>
<script src="/js/evidence.js?v=20261128a"></script>
<script src="/js/chat.js?v=20261128a"></script>
<script src="/js/empty-state.js?v=20261128a"></script>
<script src="/js/fetch.js?v=20261128a"></script>
<script src="/js/modal.js?v=20261128a"></script>
<script src="/js/settings-modal.js?v=20261128a"></script>
<script src="/js/import-modal.js?v=20261128a"></script>
<script src="/js/intake.js?v=20261128a"></script>
<script src="/js/help.js?v=20261128a"></script>
<script src="/js/events.js?v=20261128a"></script>
<script src="/js/boot.js?v=20261128a"></script>
</body>
</html>
