<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PM 审计台</title>
<link rel="stylesheet" href="/style.css?v=20261124c">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="side-brand"><span class="mark">PM</span><b>审计台</b></div>
    <div class="side-head"><span>项目</span><button class="mini" id="btn-new">+ 新建</button></div>
    <nav class="projects" id="projects"></nav>
    <div class="side-foot">
      <button class="side-btn" id="btn-import">导入数据包</button>
      <button class="side-btn" id="btn-settings">API 设置</button>
      <button class="side-btn" id="btn-help">使用说明</button>
      <div class="side-status" id="side-status"></div>
    </div>
  </aside>

  <div class="work">
    <header class="top">
      <div class="brand">
        <h1 id="pname">—</h1>
        <span class="repo" id="repo"></span>
      </div>
      <div class="top-right">
        <span class="who" id="who" title="本机身份（由 gh / git 识别）"></span>
        <span class="chip" id="role"></span>
        <span class="meta" id="fetched"></span>
        <span class="chip mono" id="hash" title="数据包指纹"></span>
        <span class="chip" id="model"></span>
        <button class="btn ghost" id="btn-auto" title="每隔 10 分钟自动刷新并写回">自动</button>
        <button class="btn ghost" id="btn-sync" title="从仓库 .pm/ 读取最新 PM 数据包">同步</button>
        <button class="btn ghost" id="btn-publish" title="把当前数据包与 Agent 简报写回仓库 .pm/">写回</button>
        <button class="btn" id="export" title="导出为可复现的数据包">导出</button>
        <button class="btn primary" id="refresh">刷新数据</button>
      </div>
    </header>

    <main id="main">
      <section class="welcome" id="welcome" hidden>
        <h2>还没有项目数据</h2>
        <p>导入数据包，或新建项目后拉取 GitHub 证据。</p>
        <div class="welcome-actions">
          <button class="btn primary" id="welcome-import">导入数据包</button>
          <button class="btn" id="welcome-new">新建项目</button>
        </div>
      </section>

      <div id="dashboard" hidden>
        <div class="pages" id="pages">
          <section class="page page-flow">
            <section class="stats" id="stats"></section>
            <div class="notice" id="notice" hidden></div>

            <section class="card graph-card">
              <div class="card-head">
                <h2>任务依赖图</h2>
                <div class="filters">
                  <span id="filters"></span>
                </div>
              </div>
              <div class="legend" id="legend"></div>
              <div class="graph-scroll" id="graph-scroll">
                <svg id="graph" xmlns="http://www.w3.org/2000/svg"></svg>
              </div>
              <p class="hint">点节点看详情；滚轮 / ↑↓ 翻页</p>
            </section>
          </section>

          <section class="page page-progress">
            <div class="progress-grid">
              <section class="card">
                <h2>关键路径</h2>
                <div id="critical"></div>
                <div class="card-foot">
                  <button class="mini" id="btn-prnote" title="把当前进度摘要评论到指定 PR">发 PR 备注</button>
                </div>
              </section>
              <section class="card">
                <div class="card-head">
                  <h2>催办</h2>
                  <span class="chip" id="alerts-count"></span>
                </div>
                <p class="hint">本机提醒，不自动发 GitHub。</p>
                <div id="blockers"></div>
              </section>
              <section class="card">
                <h2>按人</h2>
                <div id="people"></div>
              </section>
            </div>
          </section>

          <section class="page page-trail">
            <section class="card trail-card">
              <div class="card-head">
                <h2>证据链审计</h2>
                <div class="trail-tools">
                  <span class="chip" id="trail-verify"></span>
                  <button class="mini" id="btn-trail-md" title="下载 Markdown 证据链报告">下载报告</button>
                </div>
              </div>
              <p class="hint">完成只认合并 PR / 关闭 issue。</p>
              <div class="trail-scroll" id="trail"></div>
            </section>
          </section>

          <section class="page page-chat">
            <section class="card chat-card">
                <div class="card-head">
                  <h2>对话</h2>
                  <div class="seg" id="mode">
                    <button data-mode="beginner">小白</button>
                    <button data-mode="advanced">进阶</button>
                  </div>
                </div>
                <div class="chat-tools">
                  <button class="tool" id="btn-agent">Agent 简报</button>
                </div>
                <div class="chat" id="chat"></div>
                <div class="prompts" id="prompts"></div>
                <div class="composer">
                  <textarea id="q" rows="2" placeholder="问进度或卡点…"></textarea>
                  <button class="btn primary" id="send">发送</button>
                </div>
              </section>
          </section>
        </div>

        <nav class="page-nav" id="page-nav" aria-label="分页">
          <button data-page="0" data-label="流程" class="on" title="流程（第 1 页）"></button>
          <button data-page="1" data-label="进度" title="进度（第 2 页）"></button>
          <button data-page="2" data-label="证据" title="证据链（第 3 页）"></button>
          <button data-page="3" data-label="对话" title="对话（第 4 页）"></button>
        </nav>
      </div>
    </main>
  </div>
</div>

<div id="node-peek" hidden></div>

<div class="drawer-mask" id="mask" hidden></div>
<aside class="drawer" id="drawer" hidden></aside>

<div class="modal-mask" id="modal-mask" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>

<script src="/app.js?v=20261124c"></script>
</body>
</html>
